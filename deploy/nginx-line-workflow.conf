# nginx vhost สำหรับ LINE Workflow  →  https://line.espaengineering.com
#
# !! เครื่อง 147.50.255.198 มีเว็บ espaengineering.com รัน production อยู่
#    ไฟล์นี้เป็น "ไฟล์ใหม่แยกต่างหาก" ใน conf.d/ ไม่แตะ espaengineering.com.conf เดิม
#
# ไฟล์นี้ตั้งใจมีแต่ block port 80 อย่างเดียว
# อย่าเติม "listen 443 ssl" เองก่อนมีใบรับรอง — nginx บังคับว่า server ที่ listen 443 ssl
# ต้องมี ssl_certificate ด้วย ไม่งั้น nginx -t จะ fail ทั้งเครื่อง (เว็บบริษัทล่มไปด้วย)
# ให้ certbot --nginx เป็นคนสร้าง block 443 และ redirect ให้เองหลังออกใบรับรองสำเร็จ
#
# ติดตั้ง:
#   scp deploy/nginx-line-workflow.conf root@147.50.255.198:/etc/nginx/conf.d/line.espaengineering.com.conf
#   ssh root@147.50.255.198 "nginx -t && systemctl reload nginx"
#   ^ nginx -t ต้องผ่านก่อนเสมอ ไม่ผ่านห้าม reload
#
# ออกใบรับรอง (DNS wildcard *.espaengineering.com ชี้มาที่เครื่องนี้อยู่แล้ว
# ใบเดิมครอบคลุมแค่ espaengineering.com + www. จึงต้องออกใบใหม่ให้ line.):
#   certbot --nginx -d line.espaengineering.com

server {
    listen 80;
    listen [::]:80;
    server_name line.espaengineering.com;

    # LINE ส่งไฟล์ผ่าน webhook ได้ถึง 25 MB (ตาม MEDIA_MAX_SIZE_MB)
    client_max_body_size 30m;

    access_log /var/log/nginx/line-workflow.access.log;
    error_log  /var/log/nginx/line-workflow.error.log;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;

        # สามบรรทัดนี้จำเป็นต่อ TRUST_PROXY=true ในแอป
        # ถ้าขาด X-Forwarded-Proto cookie ที่เป็น secure จะไม่ถูกส่งกลับ = ล็อกอินไม่ได้
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # LINE รอ 2xx กลับภายในราว 2 วินาที ไม่ให้ค้างนานเกิน
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3500/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
