# nginx vhost สำหรับ LINE Workflow  →  https://line.espaengineering.com
#
# !! เครื่อง 147.50.255.198 มีเว็บ espaengineering.com รัน production อยู่
#    ไฟล์นี้เป็น "ไฟล์ใหม่แยกต่างหาก" ใน conf.d/ ไม่แตะ espaengineering.com.conf เดิม
#
# ตอนนี้ line.espaengineering.com ยังไม่มี vhost จึงตกไปที่ default server
# (http = 404 จาก sites-enabled/espa, https = เด้งไปเว็บเดิม)
# พอวางไฟล์นี้แล้ว nginx จะ match ตาม server_name ก่อน default
#
# ติดตั้ง:
#   scp deploy/nginx-line-workflow.conf root@147.50.255.198:/etc/nginx/conf.d/line.espaengineering.com.conf
#   ssh root@147.50.255.198 "nginx -t && systemctl reload nginx"
#   ^ nginx -t ต้องผ่านก่อนเสมอ ไม่ผ่านห้าม reload เพราะเว็บบริษัทจะล่มไปด้วย
#
# ออกใบรับรอง (DNS wildcard *.espaengineering.com ชี้มาที่เครื่องนี้อยู่แล้ว
# ใบเดิมครอบคลุมแค่ espaengineering.com + www. จึงต้องออกใบใหม่ให้ line.):
#   certbot --nginx -d line.espaengineering.com
#   ^ certbot จะแก้ listen 80 เป็น redirect และเติมบรรทัด ssl_* ให้เอง

server {
    listen 80;
    server_name line.espaengineering.com;

    # certbot จะแทนที่ block นี้ด้วย redirect ไป https ให้เองหลังออกใบรับรอง
    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    server_name line.espaengineering.com;

    # LINE ส่งไฟล์ผ่าน webhook ได้ถึง 25 MB (ตาม MEDIA_MAX_SIZE_MB)
    client_max_body_size 30m;

    access_log /var/log/nginx/line-workflow.access.log;
    error_log  /var/log/nginx/line-workflow.error.log;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;

        # สามบรรทัดนี้จำเป็นต่อ TRUST_PROXY=true ในแอป
        # ถ้าขาด X-Forwarded-Proto cookie ที่เป็น secure จะไม่ถูกส่งกลับ = ล็อกอินไม่ได้
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # LINE รอ 2xx กลับภายในราว 2 วินาที ไม่ให้ค้างนานเกิน
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3500/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # certbot จะเติม 5 บรรทัดนี้ให้เองตอนรัน --nginx
    listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/line.espaengineering.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/line.espaengineering.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
