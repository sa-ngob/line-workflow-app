# ==========================================================================
#  LINE Workflow Automation - production stack
#  ปลายทาง: /opt/espa/apps/line-workflow/  บน 147.50.255.198
#
#  เขียนตามรูปแบบเดียวกับ /opt/espa/apps/website/docker-compose.yml
#  ที่รันอยู่บนเครื่องนี้อยู่แล้ว (expose เฉพาะ 127.0.0.1, logging จำกัดขนาด,
#  healthcheck ทุกตัว, restart: unless-stopped)
#
#  ใช้ network ของตัวเอง ไม่ต่อเข้า espa-network
#  เพื่อไม่ให้แอปนี้มองเห็นฐานข้อมูลของเว็บบริษัท และกลับกัน
#
#  คำสั่ง (รันจาก /opt/espa/apps/line-workflow/):
#    docker compose -f deploy/docker-compose.prod.yml up -d --build
#    docker compose -f deploy/docker-compose.prod.yml logs -f app
#    docker compose -f deploy/docker-compose.prod.yml down
# ==========================================================================
name: line-workflow

services:
  app:
    container_name: line-workflow-app
    build:
      context: ..
      dockerfile: Dockerfile
    image: line-workflow-app:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 3500
      # ชี้ไปที่ container postgres ในสแตกนี้ ไม่ใช่ localhost
      DATABASE_URL: postgres://lineapp:${POSTGRES_PASSWORD}@postgres:5432/linechat
      MEDIA_LOCAL_DIR: /app/storage/media
    # ผูกกับ 127.0.0.1 เท่านั้น ให้ nginx บน host เป็นทางเข้าเดียวจากภายนอก
    ports:
      - "127.0.0.1:3500:3500"
    volumes:
      - line-workflow-media:/app/storage
      - line-workflow-reports:/app/reports
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - line-workflow-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: line-workflow-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linechat
      POSTGRES_USER: lineapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Bangkok
    # ไม่ publish port ออกนอก container เลย เข้าถึงได้เฉพาะแอปในสแตกนี้
    expose:
      - "5432"
    volumes:
      - line-workflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineapp -d linechat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - line-workflow-network

networks:
  line-workflow-network:
    driver: bridge

volumes:
  line-workflow-postgres-data:
  line-workflow-media:
  line-workflow-reports:
